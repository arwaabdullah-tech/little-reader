server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 10m;
 # API (story writing and pictures can take a minute or two)
 location /api/ {proxy_pass http://api:8000;proxy_read_timeout 240s;proxy_set_header Host $host;proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;}
 # / = landing page (index.html), /app = the web app
 location = /app {try_files /app.html =404;}
 location = /app/ {return 301 /app;}
 location / {try_files $uri $uri/ =404;}
}
